services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - webserver
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      dokku:
        condition: service_started

  dokku:
    # Ferry tracks the current Dokku image by policy. Resolve and record its
    # immutable digest in the target BOM immediately before any VM compose apply.
    image: dokku/dokku:latest
    container_name: dokku
    hostname: ${DOKKU_HOSTNAME:-apps.local}
    environment:
      DOKKU_HOSTNAME: ${DOKKU_HOSTNAME:-apps.local}
      DOKKU_HOST_ROOT: /var/lib/dokku/home/dokku
      DOKKU_LIB_HOST_ROOT: /var/lib/dokku/var/lib/dokku
    ports:
      - "3022:22"
    volumes:
      - dokku-data:/mnt/dokku
      - /var/run/docker.sock:/var/run/docker.sock
    # No pid: host / CAP_SYS_ADMIN by default.
    # Generated apps use HTTP path healthchecks in app.json (see generators/_shared).
    # Dokku's default listening probe may warn without host PID + SYS_ADMIN; that warn is non-fatal.
    mem_limit: 256m
    networks:
      - webserver
    restart: unless-stopped

networks:
  webserver:
    external: true

volumes:
  dokku-data:
    external: true
